<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="60%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>
    <clipPath id="logoClip">
      <rect x="100" y="50" width="200" height="200" rx="24"/>
    </clipPath>
  </defs>
  <rect x="0.75" y="0.75" width="398.5" height="298.5" rx="16" fill="url(#bg)" stroke="#333333" stroke-width="1.5"/>
<g clip-path="url(#logoClip)">
    <image x="100" y="50" width="200" height="200" href="data:image/png;base64," preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="100" y="50" width="200" height="200" rx="24" fill="none" stroke="#333333" stroke-width="1.5"/>
</svg>